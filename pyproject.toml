[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lightscan-trust-engine"
version = "0.1.0"
description = "Explainable vulnerability prioritisation for security scanners"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "scikit-learn>=1.5,<2"]

[project.scripts]
trust-score = "trust_scorer:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
